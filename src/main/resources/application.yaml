spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bloodbridge

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bloodbridge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:radhe}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

